name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      # js/inline_widget.js imports sibling modules, so it must be bundled;
      # copying it verbatim would ship unresolved relative imports.
      - name: Build JS widget bundle
        run: |
          npm ci
          npm run build
          if grep -qE '^\s*import\b' src/astrowidget/static/widget.js; then
            echo "widget.js still contains import statements" >&2
            exit 1
          fi

      - name: Install Python build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
